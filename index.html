<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanshu Kumar</title>
<meta name="description" content="Priyanshu Kumar — independent researcher in number theory. Reconstructing and extending Ramanujan's series for 1/π.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glow" id="glow"></div>
  <div class="wrap">

    <nav class="top">
      <a href="index.html" aria-current="page">home</a>
      <a href="notebook.html">notebook</a>
      <a href="https://doi.org/10.5281/zenodo.22715269">paper</a>
    </nav>

    <div class="mono rise" style="color:var(--accent); font-size:14px; margin-bottom:22px; text-align:center; animation-delay:.05s;" id="heroEq"></div>

    <div class="hero-center rise" style="animation-delay:.1s;">
      <div class="avatar" id="avatar"></div>
      <h1 id="siteName" style="font-size:36px;"></h1>
      <p class="nickname" id="siteNickname"></p>
      <span class="status-line" id="siteStatus"></span>
    </div>

    <p class="lede rise" id="siteLede" style="animation-delay:.2s;"></p>

    <div class="pills rise" id="sitePills" style="animation-delay:.25s;"></div>

    <div id="siteBio"></div>

    <hr class="rule">

    <h2 class="rise">what I've been building</h2>
    <div class="tilt-card rise" id="tiltCard">
      <h3 id="paperTitle"></h3>
      <p id="paperDesc"></p>
      <div class="meta">
        <span id="paperMeta"></span>
        <span><a class="doi" id="paperDoi" href="#"></a></span>
      </div>
    </div>

    <hr class="rule">

    <h2 class="rise">elsewhere</h2>
    <ul class="linkgrid rise" id="siteLinks"></ul>

    <footer class="page" id="siteFooter"></footer>
  </div>

<script src="content.js"></script>
<script>
  // ---- render everything from content.js — this is the only script
  // that needs to know about SITE's structure; edit content.js, not this. ----
  (function(){
    document.getElementById('avatar').innerHTML = SITE.photo
      ? '<img src="' + SITE.photo + '" alt="' + SITE.name + '">'
      : SITE.monogram;
    document.getElementById('siteName').textContent = SITE.name;
    document.getElementById('siteNickname').textContent = SITE.nickname;
    document.getElementById('siteStatus').innerHTML = '<span class="dot"></span>' + SITE.status;
    document.getElementById('siteLede').textContent = SITE.lede;

    var pills = document.getElementById('sitePills');
    SITE.pills.forEach(function(p){
      var span = document.createElement('span');
      span.className = 'pill';
      span.textContent = p;
      pills.appendChild(span);
    });

    var bio = document.getElementById('siteBio');
    SITE.bio.forEach(function(text, i){
      var p = document.createElement('p');
      p.className = i === 0 ? 'rise' : 'muted rise';
      p.style.animationDelay = (0.35 + i * 0.1) + 's';
      p.textContent = text;
      bio.appendChild(p);
    });

    document.getElementById('paperTitle').textContent = SITE.featured.title;
    document.getElementById('paperDesc').textContent = SITE.featured.description;
    document.getElementById('paperMeta').textContent = SITE.featured.meta;
    var doiLink = document.getElementById('paperDoi');
    doiLink.href = SITE.featured.doiUrl;
    doiLink.textContent = SITE.featured.doiLabel;

    var linksEl = document.getElementById('siteLinks');
    SITE.links.forEach(function(l){
      var li = document.createElement('li');
      var svg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' + (ICONS[l.icon] || '') + '</svg>';
      li.innerHTML = '<a href="' + l.url + '">' + svg + ' ' + l.label + '</a>';
      linksEl.appendChild(li);
    });

    document.getElementById('siteFooter').textContent = SITE.location + ' · last touched this page ' +
      new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  })();
</script>

<script>
  // ambient cursor glow — one continuous interactive layer instead of
  // scattered one-off hover effects on individual elements
  (function(){
    var glow = document.getElementById('glow');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced || window.matchMedia('(hover: none)').matches) return;
    window.addEventListener('mousemove', function(e){
      glow.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px) translate(-50%,-50%)';
    });
  })();

  // subtle tilt on the featured work card, mouse-position driven
  (function(){
    var card = document.getElementById('tiltCard');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced || window.matchMedia('(hover: none)').matches) return;
    card.addEventListener('mousemove', function(e){
      var r = card.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = 'perspective(600px) rotateY(' + (x*4) + 'deg) rotateX(' + (-y*4) + 'deg)';
    });
    card.addEventListener('mouseleave', function(){
      card.style.transform = 'perspective(600px) rotateY(0) rotateX(0)';
    });
  })();

  // hero: pi digits typed once on load, subject-grounded rather than decorative
  (function(){
    var el = document.getElementById('heroEq');
    var digits = "3.14159265358979323846";
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){ el.textContent = "π"; return; }
    var i = 0;
    function tick(){
      if(i <= digits.length){ el.textContent = digits.slice(0, i); i++; setTimeout(tick, 40); }
    }
    setTimeout(tick, 350);
  })();
</script>
</body>
</html>
